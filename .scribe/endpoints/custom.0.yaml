# Custom endpoints for Add2Farm resources
# Auth endpoints are added here manually since they're public routes

- httpMethods:
    - POST
  uri: api/add2farm/auth/register
  metadata:
    groupName: Add2Farm Authentication
    title: Register a new user
    description: 'Register a new user account for Add2Farm mobile/web application.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    mobile_number:
      name: mobile_number
      description: 'User mobile number with country code. Must be unique.'
      required: true
      example: '+1234567890'
      type: string
    name:
      name: name
      description: 'User full name. Optional, defaults to Add2Farm User.'
      required: false
      example: 'John Doe'
      type: string
    password:
      name: password
      description: 'Password (minimum 8 characters).'
      required: true
      example: 'password123'
      type: string
    password_confirmation:
      name: password_confirmation
      description: 'Password confirmation.'
      required: true
      example: 'password123'
      type: string
    type:
      name: type
      description: 'User type: 1=SuperAdmin, 2=FarmOwner.'
      required: true
      example: 2
      type: integer
  responses:
    - status: 201
      content: '{"success": true, "message": "OTP sent successfully."}'
    - status: 422
      content: '{"success": false, "errors": {"mobile_number": ["The mobile number has already been taken."]}}'

- httpMethods:
    - POST
  uri: api/add2farm/auth/login
  metadata:
    groupName: Add2Farm Authentication
    title: Login user
    description: 'Login to Add2Farm with mobile number and password.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    mobile_number:
      name: mobile_number
      description: 'User mobile number with country code.'
      required: true
      example: '+1234567890'
      type: string
    password:
      name: password
      description: 'User password.'
      required: true
      example: 'password123'
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "Login successful.", "data": {"user": {"id": 1, "name": "John Doe", "mobile_number": "+1234567890", "type": 2, "type_label": "Farm Owner", "status": "Active"}, "token": "1|abcdefghijklmnopqrstuvwxyz123456789"}}'

- httpMethods:
    - POST
  uri: api/add2farm/auth/verify-otp
  metadata:
    groupName: Add2Farm Authentication
    title: Verify OTP
    description: 'Verify OTP code sent to user mobile number during registration or password reset.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    mobile_number:
      name: mobile_number
      description: 'User mobile number.'
      required: true
      example: '+1234567890'
      type: string
    otp:
      name: otp
      description: 'OTP code (6 digits).'
      required: true
      example: '123456'
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "OTP verified successfully.", "data": {"user": {"id": 1, "name": "John Doe", "mobile_number": "+1234567890", "type": 2, "type_label": "Farm Owner", "status": "Active"}, "token": "1|abcdefghijklmnopqrstuvwxyz123456789"}}'

- httpMethods:
    - POST
  uri: api/add2farm/auth/resend-otp
  metadata:
    groupName: Add2Farm Authentication
    title: Resend OTP
    description: 'Resend OTP code to user mobile number.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    mobile_number:
      name: mobile_number
      description: 'User mobile number.'
      required: true
      example: '+1234567890'
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "OTP resent successfully."}'

- httpMethods:
    - POST
  uri: api/add2farm/auth/forgot-password
  metadata:
    groupName: Add2Farm Authentication
    title: Forgot Password - Step 1
    description: 'Request password reset by providing mobile number. An OTP will be sent to verify identity before allowing password change.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    mobile_number:
      name: mobile_number
      description: 'User mobile number.'
      required: true
      example: '+1234567890'
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "OTP sent to your mobile number. Please verify it to reset your password."}'
    - status: 404
      content: '{"success": false, "message": "User not found."}'

- httpMethods:
    - POST
  uri: api/add2farm/auth/verify-otp
  metadata:
    groupName: Add2Farm Authentication
    title: Verify OTP - Step 2 (2FA)
    description: 'Verify OTP code sent during password reset or registration. This is required before you can reset your password or complete registration.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    mobile_number:
      name: mobile_number
      description: 'User mobile number.'
      required: true
      example: '+1234567890'
      type: string
    otp:
      name: otp
      description: 'OTP code (6 digits) sent to mobile number. Required for 2FA.'
      required: true
      example: '123456'
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "OTP verified successfully.", "data": {"user": {"id": 1, "name": "John Doe", "mobile_number": "+1234567890", "type": 2, "type_label": "Farm Owner", "status": "Active"}, "token": "1|abcdefghijklmnopqrstuvwxyz123456789"}}'
    - status: 401
      content: '{"success": false, "message": "Invalid or expired OTP."}'

- httpMethods:
    - POST
  uri: api/add2farm/auth/reset-password
  metadata:
    groupName: Add2Farm Authentication
    title: Reset Password - Step 3
    description: 'Reset password using token from OTP verification. No mobile number needed - token identifies the user.'
    authenticated: false
  headers:
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    token:
      name: token
      description: 'Token received from verify-otp endpoint (Step 2). Identifies the user - no mobile number needed.'
      required: true
      example: '1|abcdefghijklmnopqrstuvwxyz123456789'
      type: string
    password:
      name: password
      description: 'New password (minimum 8 characters).'
      required: true
      example: 'newpassword123'
      type: string
    password_confirmation:
      name: password_confirmation
      description: 'New password confirmation.'
      required: true
      example: 'newpassword123'
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "Password reset successfully. Please login with new password."}'
    - status: 401
      content: '{"success": false, "message": "Invalid or expired token. Please verify OTP first."}'
    - status: 404
      content: '{"success": false, "message": "User not found."}'
    - status: 422
      content: '{"success": false, "errors": {"password": ["The password confirmation does not match."]}}'

- httpMethods:
    - GET
  uri: api/add2farm/flocks
  metadata:
    groupName: Add2Farm Flocks
    title: List all flocks
    description: 'Get paginated list of all flocks with search and filtering.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  queryParameters:
    page:
      name: page
      description: 'optional Pagination page number.'
      required: false
      example: 1
      type: integer
    per_page:
      name: per_page
      description: 'optional Items per page. Default: 15.'
      required: false
      example: 20
      type: integer
    search:
      name: search
      description: 'optional Search by flock name.'
      required: false
      example: Flock1
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "Flocks retrieved successfully.", "data": {"current_page": 1, "data": [{"id": 1, "name": "Farm1-Flock4", "farm_id": 1, "farm_name": "Main Farm", "chicks_supplier_id": 1, "chicks_supplier_name": "Al-Rowad Farm", "breed": "Broiler,Cobb 500", "start_date": "2026-05-18", "total_quantity": 12500}], "total": 10, "last_page": 1}}'

- httpMethods:
    - POST
  uri: api/add2farm/flocks
  metadata:
    groupName: Add2Farm Flocks
    title: Create a new flock
    description: 'Create a new flock with hangar allocations.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    name:
      name: name
      description: Flock name.
      required: true
      example: Farm1-Flock4
      type: string
    farm_id:
      name: farm_id
      description: Farm ID.
      required: true
      example: 1
      type: integer
    chicks_supplier_id:
      name: chicks_supplier_id
      description: Chicks supplier ID.
      required: true
      example: 1
      type: integer
    breed:
      name: breed
      description: Breed name.
      required: true
      example: Broiler,Cobb 500
      type: string
    start_date:
      name: start_date
      description: 'Start date (format: dd-mm-yyyy).'
      required: true
      example: 18-05-2026
      type: string
    total_quantity:
      name: total_quantity
      description: Total number of chicks.
      required: true
      example: 12500
      type: integer
    hangar_allocations:
      name: hangar_allocations
      description: Array of hangar allocations.
      required: true
      example:
        - hangar_id: 1
          quantity: 3000
        - hangar_id: 2
          quantity: 3000
      type: array
  responses:
    - status: 201
      content: '{"success": true, "message": "Flock created successfully.", "data": {"id": 1, "name": "Farm1-Flock4", "farm_id": 1, "farm_name": "Main Farm", "chicks_supplier_id": 1, "chicks_supplier_name": "Al-Rowad Farm", "breed": "Broiler,Cobb 500", "start_date": "2026-05-18", "total_quantity": 12500, "created_by": 1, "created_by_name": "Admin Name", "created_at": "2026-08-07T10:30:00Z"}}'

