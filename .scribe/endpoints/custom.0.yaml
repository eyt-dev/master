- httpMethods:
    - GET
  uri: api/add2farm/daily-records
  metadata:
    groupName: Add2Farm Daily Records
    title: List all daily records
    description: 'Get paginated list of all daily records with search and filtering.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  queryParameters:
    page:
      name: page
      description: 'optional Pagination page number.'
      required: false
      example: 1
      type: integer
    per_page:
      name: per_page
      description: 'optional Items per page. Default: 15.'
      required: false
      example: 20
      type: integer
    flock_id:
      name: flock_id
      description: 'optional Filter by flock ID.'
      required: false
      example: 1
      type: integer
    farm_id:
      name: farm_id
      description: 'optional Filter by farm ID.'
      required: false
      example: 1
      type: integer
    record_date:
      name: record_date
      description: 'optional Filter by record date (format: yyyy-mm-dd).'
      required: false
      example: 2026-08-07
      type: string
  responses:
    - status: 200
      content: '{"success": true, "message": "Daily records retrieved successfully.", "data": {"current_page": 1, "data": [{"id": 1, "record_date": "2026-08-07", "farm_id": 1, "farm_name": "Main Farm", "flock_id": 1, "flock_name": "Farm1-Flock4", "hangar_id": 1, "hangar_name": "Farm1-Hangar1", "feed_kg": 450.5, "eggs_tray_30": 12, "eggs_count": 360, "eggs_weight": 18.5, "chicks_weight": 1.85, "mortality": 5}], "total": 50, "last_page": 3}}'

- httpMethods:
    - POST
  uri: api/add2farm/daily-records
  metadata:
    groupName: Add2Farm Daily Records
    title: Create a new daily record
    description: 'Create a new daily record for a flock/hangar combination.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  bodyParameters:
    record_date:
      name: record_date
      description: 'Record date (format: dd-mm-yyyy).'
      required: true
      example: 07-08-2026
      type: string
    flock_id:
      name: flock_id
      description: Flock ID.
      required: true
      example: 1
      type: integer
    hangar_id:
      name: hangar_id
      description: Hangar ID.
      required: true
      example: 1
      type: integer
    feed_kg:
      name: feed_kg
      description: Feed quantity in kg.
      required: true
      example: 450.50
      type: number
    eggs_tray_30:
      name: eggs_tray_30
      description: 'Number of egg trays (30 count).'
      required: false
      example: 12
      type: integer
    eggs_count:
      name: eggs_count
      description: Egg count.
      required: false
      example: 360
      type: integer
    eggs_weight:
      name: eggs_weight
      description: Eggs weight in kg.
      required: false
      example: 18.50
      type: number
    chicks_weight:
      name: chicks_weight
      description: Chicks weight in kg.
      required: false
      example: 1.85
      type: number
    mortality:
      name: mortality
      description: Mortality count.
      required: false
      example: 5
      type: integer
  responses:
    - status: 201
      content: '{"success": true, "message": "Daily record created successfully.", "data": {"id": 1, "record_date": "2026-08-07", "farm_id": 1, "farm_name": "Main Farm", "flock_id": 1, "flock_name": "Farm1-Flock4", "hangar_id": 1, "hangar_name": "Farm1-Hangar1", "feed_kg": 450.5, "eggs_tray_30": 12, "eggs_count": 360, "eggs_weight": 18.5, "chicks_weight": 1.85, "mortality": 5, "created_by": 1, "created_by_name": "Admin Name", "created_at": "2026-08-07T10:30:00Z"}}'

