- httpMethods:
    - PUT
  uri: api/add2farm/farms/{farm}
  metadata:
    groupName: Add2Farm Farms
    title: Update a farm
    description: 'Update farm details including name, location, type, hangars count and farmer assignment.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  urlParameters:
    farm:
      name: farm
      description: 'The farm ID.'
      required: true
      example: 1
      type: integer
  bodyParameters:
    name:
      name: name
      description: Farm name.
      required: true
      example: Green Valley Farm Updated
      type: string
    location:
      name: location
      description: Farm location.
      required: true
      example: North Region Updated
      type: string
    type:
      name: type
      description: Farm type.
      required: true
      example: Poultry
      type: string
    number_of_hangars:
      name: number_of_hangars
      description: 'Number of hangars (1-999).'
      required: true
      example: 5
      type: integer
    assigned_to:
      name: assigned_to
      description: Farmer ID to assign the farm to.
      required: false
      example: 2
      type: integer
  responses:
    - status: 200
      content: |-
        {
          "success": true,
          "message": "Farm updated successfully.",
          "data": {
            "id": 1,
            "name": "Green Valley Farm Updated",
            "location": "North Region Updated",
            "type": "Poultry",
            "number_of_hangars": 5,
            "assigned_to": 2,
            "assigned_to_name": "Farmer Name",
            "created_by": 1,
            "created_by_name": "Farm Owner Name",
            "created_at": "2026-08-07T10:30:00Z",
            "updated_at": "2026-08-10T14:22:00Z"
          }
        }
    - status: 404
      content: |-
        {
          "success": false,
          "message": "Farm not found."
        }
    - status: 422
      content: |-
        {
          "success": false,
          "message": "This farmer is already assigned to another farm. Each farmer can be assigned to only 1 farm."
        }

- httpMethods:
    - DELETE
  uri: api/add2farm/farms/{farm}
  metadata:
    groupName: Add2Farm Farms
