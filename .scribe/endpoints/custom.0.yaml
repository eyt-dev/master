# Custom endpoints for Update and Delete operations
# These are added manually because Scribe's automatic route detection doesn't always
# pick up resource routes with URI parameters

- httpMethods:
    - GET
  uri: api/add2farm/supervisors/{supervisor}
  metadata:
    groupName: Add2Farm Supervisors (Type 3)
    title: Get a single supervisor
    description: 'Retrieve detailed information of a specific supervisor.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  urlParameters:
    supervisor:
      name: supervisor
      description: 'The supervisor ID.'
      required: true
      example: 1
      type: integer
  responses:
    - status: 200
      content: |-
        {
          "success": true,
          "message": "Supervisor retrieved successfully.",
          "data": {
            "id": 1,
            "name": "Supervisor Name",
            "mobile_number": "+1234567890",
            "email": "supervisor@add2farm.local",
            "type": 3,
            "type_label": "Supervisor",
            "status": "Active",
            "created_by_name": "Admin Name",
            "created_at": "2026-08-07T10:30:00Z"
          }
        }
    - status: 404
      content: |-
        {
          "success": false,
          "message": "Supervisor not found."
        }

- httpMethods:
    - PUT
  uri: api/add2farm/supervisors/{supervisor}
  metadata:
    groupName: Add2Farm Supervisors (Type 3)
    title: Update a supervisor
    description: 'Update supervisor details including name, email, status and project assignments. Mobile number and type cannot be changed.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  urlParameters:
    supervisor:
      name: supervisor
      description: 'The supervisor ID.'
      required: true
      example: 1
      type: integer
  bodyParameters:
    name:
      name: name
      description: "Supervisor's full name."
      required: true
      example: John Supervisor Updated
      type: string
    email:
      name: email
      description: Email address.
      required: false
      example: john.updated@example.com
      type: string
    status:
      name: status
      description: 'Status (Active, Inactive, Disable).'
      required: true
      example: Active
      type: string
    project_rows:
      name: project_rows
      description: Array of project assignments.
      required: false
      example:
        - project_id: 1
          status: Active
      type: array
  responses:
    - status: 200
      content: |-
        {
          "success": true,
          "message": "Supervisor updated successfully.",
          "data": {
            "id": 1,
            "name": "John Supervisor Updated",
            "mobile_number": "+1234567890",
            "email": "john.updated@example.com",
            "type": 3,
            "type_label": "Supervisor",
            "status": "Active",
            "created_by_name": "Admin Name",
            "created_at": "2026-08-07T10:30:00Z"
          }
        }
    - status: 404
      content: |-
        {
          "success": false,
          "message": "Supervisor not found."
        }
    - status: 422
      content: |-
        {
          "success": false,
          "errors": {
            "email": ["The email has already been taken."]
          }
        }

- httpMethods:
    - DELETE
  uri: api/add2farm/supervisors/{supervisor}
  metadata:
    groupName: Add2Farm Supervisors (Type 3)
    title: Delete a supervisor
    description: 'Delete a supervisor and their project status records.'
    authenticated: true
  headers:
    Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
    Content-Type: application/json
    Accept: application/json
  urlParameters:
    supervisor:
      name: supervisor
      description: 'The supervisor ID.'
      required: true
      example: 1
      type: integer
  responses:
    - status: 200
      content: |-
        {
          "success": true,
          "message": "Supervisor deleted successfully."
        }
    - status: 404
      content: |-
        {
          "success": false,
          "message": "Supervisor not found."
        }

